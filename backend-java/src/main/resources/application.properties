# IIoT Solar Monitoring System - Java Spring Boot Configuration

server.port=8000

# Database Configuration (PostgreSQL with H2 fallback)
spring.datasource.url=jdbc:postgresql://localhost:5432/solardb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# MQTT Broker Settings
mqtt.broker.host=localhost
mqtt.broker.port=1883
mqtt.topic.telemetry=solar/+/telemetry
